name: Python application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  offline-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install development dependencies (no GPIO)
        run: python -m pip install -r requirements-dev.txt
      - name: Check syntax and undefined names
        run: python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --indent-size=2 --exclude=.venv --statistics
      - name: Run hermetic Python tests
        run: python -m pytest -q -o log_cli=false
      - name: Run offline UI tests
        run: node --test tests/ui.test.cjs
